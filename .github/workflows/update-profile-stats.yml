name: Update Profile Statistics

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-profile-stats.yml"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  generate-statistics:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate profile statistics
        uses: cicirello/user-statistician@v1
        with:
          colors: dark-dimmed
          include-title: false
          hide-keys: sponsors, sponsoring, private, joined, mostStarred, mostForked, followers, following
          max-languages: 6
          commit-and-push: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push generated statistics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add images/userstats.svg

          if git diff --cached --quiet; then
            echo "Statistics are already up to date."
            exit 0
          fi

          git commit -m "chore: update profile statistics"
          git pull --rebase origin main
          git push origin HEAD:main
