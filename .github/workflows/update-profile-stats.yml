name: Update Profile Statistics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  generate-statistics:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      - name: Generate GitHub profile statistics
        uses: cicirello/user-statistician@v1
        with:
          colors: dark-dimmed
          include-title: false
          hide-keys: sponsors, sponsoring, private
          max-languages: 8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
